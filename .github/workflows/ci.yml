name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The jobs only read the repository
permissions:
  contents: read

# A newer push to the same branch or pull request replaces a run still going
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-tests:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      # Service containers can't take --replSet, and the app's transactions
      # need a replica set, so MongoDB is started by hand (as in the README)
      - name: Start MongoDB as a single-node replica set
        working-directory: .
        run: |
          docker run -d --name ems-mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          # When a wait runs out, show MongoDB's own log so the cause is visible
          fail() { echo "::error::$1"; docker logs --tail 50 ems-mongo 2>&1; exit 1; }
          for i in $(seq 1 30); do
            docker exec ems-mongo mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' >/dev/null 2>&1 && break
            [ "$i" = 30 ] && fail "MongoDB did not start within 30 seconds"
            sleep 1
          done
          docker exec ems-mongo mongosh --quiet --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]})' || fail "rs.initiate failed"
          for i in $(seq 1 30); do
            state=$(docker exec ems-mongo mongosh --quiet --eval 'rs.status().members[0].stateStr' 2>/dev/null || true)
            if [ "$state" = "PRIMARY" ]; then exit 0; fi
            sleep 1
          done
          fail "MongoDB replica set did not become PRIMARY within 30 seconds"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      # A fresh secret per run; nothing here needs to be kept
      - name: Write .env
        run: |
          {
            echo "MONGODB_URI=mongodb://localhost:27017/employee_management?replicaSet=rs0"
            echo "REDIS_URL=redis://localhost:6379"
            echo "JWT_SECRET=$(openssl rand -hex 64)"
          } > .env

      - name: Run the verification scripts
        run: npm test

  client-build:
    name: Client build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
